[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.0.0"            # becomes 0.1.0 when Part I is promoted (end of Chapter 7)
description = "Aegis: the SOC agent built in The Agentic AI Engineer's Handbook (repo: ai-engineer-wiley)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "ollama>=0.4",
]

[project.optional-dependencies]
notebooks = ["pandas", "matplotlib", "seaborn"]   # used by the Workbench notebooks, not the package
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
